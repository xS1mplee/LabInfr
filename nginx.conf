version: '3.8'

services:
  # Balanceador de carga y proxy
  nginx:
    image: nginx:alpine
    container_name: proxy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-prod-1
      - api-prod-2
      - api-qa
    networks:
      - red-servicios

  # Producción - Instancia 1
  api-prod-1:
    image: openjdk:17-jdk-slim
    container_name: api-prod-1
    environment:
      DB_HOST: bd-produccion
      DB_NAME: bd_prod
    depends_on:
      - bd-produccion
    networks:
      - red-servicios

  # Producción - Instancia 2
  api-prod-2:
    image: openjdk:17-jdk-slim
    container_name: api-prod-2
    environment:
      DB_HOST: bd-produccion
      DB_NAME: bd_prod
    depends_on:
      - bd-produccion
    networks:
      - red-servicios

  # QA - Instancia 1
  api-qa:
    image: openjdk:17-jdk-slim
    container_name: api-qa
    environment:
      DB_HOST: bd-qa
      DB_NAME: bd_qa
    depends_on:
      - bd-qa
    networks:
      - red-servicios

  # Base de datos Producción
  bd-produccion:
    image: postgres:15-alpine
    container_name: bd-produccion
    environment:
      POSTGRES_DB: bd_prod
      POSTGRES_USER: admin_prod
      POSTGRES_PASSWORD: clave_segura_prod
    volumes:
      - datos-prod:/var/lib/postgresql/data
    networks:
      - red-servicios

  # Base de datos QA
  bd-qa:
    image: postgres:15-alpine
    container_name: bd-qa
    environment:
      POSTGRES_DB: bd_qa
      POSTGRES_USER: admin_qa
      POSTGRES_PASSWORD: clave_segura_qa
    volumes:
      - datos-qa:/var/lib/postgresql/data
    networks:
      - red-servicios

networks:
  red-servicios:
    driver: bridge

volumes:
  datos-prod:
  datos-qa: